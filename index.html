<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Your Crypto</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0e0e0e; color: #fff; padding: 20px; }
    h1 { color: #ffcc00; }
    form { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: none; }
    button { margin-top: 20px; padding: 10px; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .note { margin-top: 20px; font-size: 0.9em; color: #ccc; }
  </style>
</head>
<body>
  <h1>Create Your Crypto</h1>
  <p>Fill in your token info and send <strong>$40 in ETH or USDC</strong> to:</p>
  <p style="color: #00ffcc;"><strong>0x75e8B7b4A4Fa18914D2d9616523bB0E56B5DAf3C</strong></p>

  <form id="tokenForm">
    <label for="name">Token Name:</label>
    <input type="text" id="name" required />

    <label for="symbol">Symbol:</label>
    <input type="text" id="symbol" required />

    <label for="supply">Total Supply:</label>
    <input type="number" id="supply" required />

    <label for="mintable">Mintable?</label>
    <select id="mintable">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>

    <label for="burnable">Burnable?</label>
    <select id="burnable">
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>

    <label for="tax">Tax % (0–10):</label>
    <input type="number" id="tax" min="0" max="10" value="0" />

    <button type="submit">Download Token Config</button>
  </form>

  <div class="note">
    After payment and download, send the file to our team. We'll deploy your token on-chain and notify you!
  </div>

  <script>
    const form = document.getElementById('tokenForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const config = {
        name: document.getElementById('name').value,
        symbol: document.getElementById('symbol').value,
        totalSupply: document.getElementById('supply').value,
        mintable: document.getElementById('mintable').value === 'true',
        burnable: document.getElementById('burnable').value === 'true',
        taxPercentage: parseInt(document.getElementById('tax').value),
        paymentWallet: '0x75e8B7b4A4Fa18914D2d9616523bB0E56B5DAf3C'
      };

      const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'token-config.json';
      a.click();
    });
  </script>
</body>
</html>
