<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Crypto Token</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fc;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #28a745;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
    }
    .intro {
      margin: 20px;
      text-align: center;
      font-size: 1.2em;
    }
    .form-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .form-container input, .form-container select, .form-container button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .form-container button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
    }
    .form-container button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<header>
  <h1>Create Your Crypto Token</h1>
</header>

<div class="intro">
  <p>Make your own custom cryptocurrency token today! Choose your options and deploy your token to the blockchain.</p>
</div>

<div class="form-container">
  <h2>Enter Your Token Details</h2>
  <form id="tokenForm">
    <input type="text" id="tokenName" placeholder="Token Name" required />
    <input type="text" id="tokenSymbol" placeholder="Token Symbol" required />
    <input type="number" id="tokenSupply" placeholder="Total Supply (e.g., 1000000)" required />
    <select id="blockchain" required>
      <option value="base">Base Network</option>
      <option value="ethereum">Ethereum</option>
      <option value="polygon">Polygon</option>
      <option value="binance">Binance Smart Chain (BNB)</option>
    </select>
    <br/>
    <button type="button" id="payButton">Pay & Deploy Token</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
<script>
  const contractAddress = '0xd9CD0AF84756AFBb218aF344d93f364F4e1d8700';  // Your MetaMask wallet address

  document.getElementById("payButton").addEventListener("click", async () => {
    if (typeof window.ethereum !== 'undefined') {
      // Request wallet connection
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      const signer = provider.getSigner();
      
      await provider.send("eth_requestAccounts", []);  // Request MetaMask accounts
      const userAddress = await signer.getAddress();
      
      // Token creation details
      const tokenName = document.getElementById("tokenName").value;
      const tokenSymbol = document.getElementById("tokenSymbol").value;
      const totalSupply = document.getElementById("tokenSupply").value;
      const blockchain = document.getElementById("blockchain").value;

      // Get price based on selected blockchain
      const priceInEth = getPrice(blockchain);

      // Prepare transaction
      const tx = {
        to: contractAddress,  // Send payment to your MetaMask wallet address
        value: ethers.utils.parseEther(priceInEth.toString()),  // Payment amount
      };

      try {
        // Send the payment
        const txResponse = await signer.sendTransaction(tx);
        await txResponse.wait();  // Wait for transaction confirmation

        // Deploy the token to the user's wallet
        await deployToken(tokenName, tokenSymbol, totalSupply, blockchain, userAddress);
        alert("Token created successfully and payment received!");
      } catch (error) {
        console.error("Payment or Token Creation failed:", error);
        alert("Something went wrong! Please try again.");
      }
    } else {
      alert("MetaMask is not connected. Please install MetaMask.");
    }
  });

  // Get the payment price based on blockchain choice
  function getPrice(blockchain) {
    if (blockchain === "ethereum") {
      return 0.05; // Example price for Ethereum
    } else if (blockchain === "polygon") {
      return 0.03; // Example price for Polygon
    } else if (blockchain === "binance") {
      return 0.02; // Example price for BNB
    } else {
      return 0.05; // Default price for Base network or others
    }
  }

  // Deploy the token using the smart contract
  async function deployToken(name, symbol, supply, blockchain, userAddress) {
    const provider = new ethers.providers.JsonRpcProvider(getBlockchainUrl(blockchain));
    const wallet = new ethers.Wallet("<YOUR_PRIVATE_KEY>", provider);

    // Create contract instance and deploy token
    const contract = new ethers.Contract("<YOUR_CONTRACT_ADDRESS>", [
      // Insert the contract ABI here
    ], wallet);

    const tx = await contract.deployToken(name, symbol, supply, userAddress);
    await tx.wait();
    console.log("Token deployed successfully:", tx);
  }

  // Get blockchain URL based on user's selection
  function getBlockchainUrl(blockchain) {
    if (blockchain === "base") return "https://mainnet.base.org";
    if (blockchain === "ethereum") return "https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID";
    if (blockchain === "polygon") return "https://polygon-rpc.com";
    if (blockchain === "binance") return "https://bsc-dataseed.binance.org/";
    return "https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID";  // Default URL
  }
</script>

</body>
</html>
